name: BGP-Topology

topology:
  nodes:
    Internet:
      kind: arista_ceos
      image: ceos:4.36.1F

    ISP1:
      kind: arista_ceos
      image: ceos:4.36.1F

    ISP2:
      kind: arista_ceos
      image: ceos:4.36.1F

    Edge-Router:
      kind: arista_ceos
      image: ceos:4.36.1F

    Transit-Router:
      kind: arista_ceos
      image: ceos:4.36.1F

    Router1:
      kind: arista_ceos
      image: ceos:4.36.1F

    Router2:
      kind: arista_ceos
      image: ceos:4.36.1F

    Router3:
      kind: arista_ceos
      image: ceos:4.36.1F

    Router4:
      kind: arista_ceos
      image: ceos:4.36.1F

    Router5:
      kind: arista_ceos
      image: ceos:4.36.1F

  links:
  - endpoints: [ "Internet:eth1", "ISP1:eth1" ]
  - endpoints: [ "Internet:eth2", "ISP2:eth1" ]
  - endpoints: [ "Edge-Router:eth1", "ISP1:eth2" ]
  - endpoints: [ "Edge-Router:eth2", "ISP2:eth2" ]
  - endpoints: [ "Edge-Router:eth3", "Transit-Router:eth1" ]
  - endpoints: [ "Transit-Router:eth2", "Router1:eth1" ]
  - endpoints: [ "Transit-Router:eth3", "Router2:eth1" ]
  - endpoints: [ "Transit-Router:eth4", "Router3:eth1" ]
  - endpoints: [ "Transit-Router:eth5", "Router4:eth1" ]
  - endpoints: [ "Transit-Router:eth6", "Router5:eth1" ]
